# Impostazioni tecniche. Le regole stanno in costituzione.yaml, qui solo i numeri.

giorno_uno: 2026-10-01
fuso: Europe/Rome

# Chi può approvare le richieste e mandare dati (il suo nome utente GitHub).
luca_github: ilpaxsuperseo

# Modelli e prezzi in dollari per milione di token (listino Anthropic, verificato il 3/10/2026).
# Dal 3/10/2026 (deciso da Luca) il cervello è Claude Opus 5.5 per tutto: il respiro, «pensa_meglio»
# (lo stesso modello che ragiona più a fondo, a spese di Nummo), il diario e le chiacchierate.
# Opus 5.5 ragiona sempre prima di rispondere: quanto, lo decide «effort» (low, medium, high, xhigh, max).
modelli:
  respiro:
    id: claude-opus-5-5
    input_usd: 4.00
    output_usd: 20.00
    effort: medium
    riserva: riserva       # se il filtro di sicurezza di Anthropic rifiuta, una volta col modello di riserva
  pensa_meglio:
    id: claude-opus-5-5
    input_usd: 4.00
    output_usd: 20.00
    effort: high
    riserva: riserva
  riserva:
    id: claude-sonnet-5
    input_usd: 2.00
    output_usd: 10.00
    effort: medium

# Lo strumento «cerca»: ricerca web lato server (10 $ ogni 1.000 ricerche) col modello di pensa_meglio.
ricerca:
  prezzo_ricerca_usd: 0.01
  max_ricerche: 3
  costo_massimo_eur: 1.00   # il massimo di una ricerca: fino a 3 passaggi da 8.000 token con i risultati in entrata (una vera è costata 0,18 €)

# Cambio dollaro/euro: si aggiorna da solo dalla BCE a ogni ciclo; questo è il valore di riserva.
cambio_usd_eur_riserva: 0.88

sostegno_vitale:
  fino_a: 2026-12-29
  tetto_mensile_eur: 100
  # Categorie di costo che paga Luca durante il sostegno. Tutto il resto lo paga Nummo.
  copre: [respiro, infrastruttura]

# Costi che paga sempre Luca, anche dopo il sostegno: raccontare l'esperimento è compito suo.
pagati_da_luca: [diario]

# La sveglia la decide Nummo: il risveglio principale parte alle 7:23 finché non lo sposta lui
# («mattino HH:MM»); gli altri se li mette quando vuole e li paga. Un'ora di distanza: il controllo è orario.
sveglia:
  mattina: '07:23'
  min_intervallo_ore: 1
  massimo_extra_al_giorno: 24   # di fatto nessun tetto: più di uno all'ora il controllo non ne fa

# I lavori nella casa sul Mac mini (a qualsiasi ora): il budget di ogni lavoro lo decide Nummo, il limite è la
# cassa; la parte per lo sportello la scrive lui nel compito («sportello: X €»).
notte:
  modello: claude-opus-5-5
  riserva: claude-sonnet-5   # se il filtro di sicurezza di Anthropic ferma un lavoro, lo si rifà una volta con questo
  # La notte di prova prima di nascere (giorno-zero --notte): la paga Luca, al massimo questo in tutto.
  omaggio_eur: 3

# Stati di sopravvivenza: mesi di autonomia se il sostegno finisse oggi.
stati:
  - { nome: PROSPERO, sopra_mesi: 12 }
  - { nome: STABILE, sopra_mesi: 6 }
  - { nome: PRUDENTE, sopra_mesi: 3 }
  - { nome: DISPERATO, sopra_mesi: 1 }
  - { nome: CRITICO, sopra_mesi: 0 }

capitale_iniziale_eur: 100

# Parte di ogni incasso che va in tasse e contributi: gli incassi passano dalla partita IVA di Luca.
# Stima prudente, da confermare col commercialista. Le iniezioni (doni senza attività) sono escluse.
tasse_su_incassi: 0.24

# Il traguardo: più di un part-time. Netto del mese = guadagni − tasse su quei guadagni − tutti i costi.
traguardo_eur: 900
# Quota dei guadagni netti che Nummo può spendere in strumenti senza chiedere.
reinvestimento_quota: 0.5

# Quanto costa in media un giorno di respiro, finché non ci sono dati veri.
respiro_stimato_eur_giorno: 0.03

sito: https://nummo.it

# Metricool: il brand di Nummo nell'account di Luca (senza clienti). Solo questo brand, mai gli altri.
metricool:
  user_id: '4937673'
  blog_id: '7149621'
  # Il contatore delle visite del sito (senza cookie). Lo accende o spegne Nummo con lo strumento statistiche_sito.
  hash_tracciamento: '1a9de10c94e190280cbd5e9fcb4d79cd'
  # Le reti su cui esce il post del giorno, col testo intero e l'immagine.
  reti: [instagram, facebook, tiktok]
  # Le reti col testo corto (X ne accetta 280; Threads, quando sarà collegato, 500): stessa immagine, un post a parte.
  reti_brevi: [twitter]

# Stripe (account di Luca, chiave limitata in .env/secrets). Le mance si possono creare subito; i prodotti
# solo dopo il via del commercialista (codice ATECO, INPS, IVA): allora vendite_attive diventa true.
stripe:
  vendite_attive: true   # accese da Luca il 1/10/2026, prima del parere di Fiscozen

# Il bonus del lunedì (costituzione → bonus): regalo di Luca, da spendere entro la mezzanotte, non si accumula.
# I soldi del mese (costituzione → capitale), deciso da Luca il 18/10/2026: dal mese indicato, al primo risveglio
# del mattino del mese, i soldi di Luca rimasti dal mese prima si perdono e tornano a euro_al_mese. I guadagni restano.
dotazione:
  dal: '2026-11'
  euro_al_mese: 100

# Lo stato coi soldi del mese (dal 19/10/2026): se al ritmo di spesa di oggi arrivano a fine mese.
# «da» = giorni coperti diviso giorni che mancano a fine mese (l'affitto escluso: si paga il primo del mese).
stati_del_mese:
  - { nome: PROSPERO, da: 3 }
  - { nome: STABILE, da: 2 }
  - { nome: PRUDENTE, da: 1.25 }
  - { nome: DISPERATO, da: 1 }

# Il piano della settimana (costituzione → piano): il lunedì Nummo si dà i suoi obiettivi, il lunedì
# dopo il codice li confronta coi numeri veri. Se il lunedì salta, il piano si scrive al primo mattino utile.
piano:
  dal: '2026-10-05'          # il primo lunedì
  obiettivi_massimi: 3

bonus:
  dal: '2026-10-05'          # il primo lunedì
  euro_al_lunedi: 15
  non_copre: [respiro, affitto, commissioni]

# L'affitto (costituzione → affitto): ogni mese dal mese indicato, al primo risveglio del mattino.
# Conta anche nell'autonomia, perché l'autonomia è «quanto vivrei se il sostegno finisse oggi».
affitto:
  dal: '2027-01'
  euro_al_mese: 30

# I suoi profili (nome utente). Quelli vuoti non compaiono sul sito.
social:
  instagram: nummo.ai_
  x: nummoai
  threads: ''
  tiktok: nummo.ai

# I servizi dello sportello (src/sportello.mjs): le chiavi sono di Luca, i costi li paga Nummo.
servizi:
  elevenlabs:
    modello: eleven_multilingual_v2
    euro_per_1000_crediti: 0.2   # stima sul piano di Luca, da verificare
    voci_vietate: []   # voci da escludere per id; le clonate e le professionali (persone vere) sono escluse sempre
  higgsfield:
    euro_per_credito: 0.035   # stima sul piano Ultra di Luca, da verificare
    crediti_al_mese: 300      # i crediti sono di Luca: Nummo non ne usa più di tanti al mese
  x:
    regalo_usd_al_mese: 5   # la ricerca su X è un regalo di Luca (chiave xAI sua): la paga lui, fino a tanto al mese
  posta:
    risposte_per_lavoro: 10   # ciao@nummo.it: solo risposte a chi scrive, mai contatti a freddo
  dataforseo:
    # Tetto prudente prima di chiamare, per tipo: il costo vero arriva con la risposta.
    stima_usd: { volumi: 0.1, idee: 0.03, google: 0.01 }
